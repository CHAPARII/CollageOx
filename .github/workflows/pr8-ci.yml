name: PR8 CI

on:
  push:
    branches:
      - agent/pr8-campus-suite-implementation
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: tests
        continue-on-error: true
        run: npm test
      - name: Publish test status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ steps.tests.outcome }}' === 'success' ? 'success' : 'failure'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'pr8/npm-test',
              description: state === 'success' ? 'All PR8 tests passed' : 'PR8 test suite failed'
            })
      - name: Fail when tests fail
        if: steps.tests.outcome != 'success'
        run: exit 1
